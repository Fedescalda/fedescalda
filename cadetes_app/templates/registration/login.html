{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Ingresar</h3>
    <form method="post">{% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger small">Usuario o contraseña incorrectos.</div>{% endif %}
      <div class="mb-3"><label class="form-label" for="id_username">Usuario</label>
        <input class="form-control" name="username" id="id_username" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="id_password">Contraseña</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-success w-100">Ingresar</button>
    </form>
    <p class="mt-3 mb-0 small text-center">¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
  </div></div>
</div></div>
{% endblock %}
